<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GenAI Media Workflow &amp; Benchmark Tools</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f8fafc; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; color: #111827; }
    button, input, textarea { font-family: inherit; }

    /* ── REQ 1: Sticky nav shell ─────────────────────────── */
    .nav-shell {
      position: sticky; top: 0; z-index: 100;
      background: #f8fafc;
      border-bottom: 1px solid #e5e7eb;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .page-content { padding-top: 28px; }

    /* ── App layout ──────────────────────────────────────── */
    .app { max-width: 1080px; margin: 0 auto; padding: 0 18px 56px; }

    /* ── Header ──────────────────────────────────────────── */
    .header { position: relative; padding: 14px 0 16px; background: #f8fafc; }
    .brand-mark { position: absolute; top: 14px; right: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .brand-top { display: flex; align-items: baseline; line-height: 1; }
    .brand-top strong { font-size: 14px; font-weight: 800; letter-spacing: .12em; }
    .brand-top span   { font-size: 14px; font-weight: 300; letter-spacing: .22em; }
    .brand-sub { font-size: 9px; font-weight: 600; letter-spacing: .3em; }
    .hero-copy { padding-right: 260px; }
    .hero-title { display: flex; align-items: baseline; line-height: 1; margin-bottom: 8px; }
    .hero-title .genai {
      font-size: clamp(32px, 5.5vw, 56px); font-weight: 800; letter-spacing: -.02em;
      background: linear-gradient(150deg, #1633cc 0%, #1a6ef5 60%, #3b8ff7 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero-title .media { margin-left: 14px; font-size: clamp(32px, 5.5vw, 56px); font-weight: 300; color: #0b1840; letter-spacing: -.015em; }
    .hero-sub { font-size: 11px; font-weight: 300; letter-spacing: .38em; color: #0b1840; text-transform: uppercase; margin-bottom: 10px; }
    .hero-pills { display: flex; align-items: center; flex-wrap: wrap; }
    .hero-pills span { font-size: 10px; letter-spacing: .2em; color: #4e5f7a; white-space: nowrap; }
    .sep { width: 1px; height: 12px; background: #a0aabf; margin: 0 16px; }

    /* ── Tabs ─────────────────────────────────────────────── */
    .tabs { display: flex; overflow-x: auto; background: white; border-top: 1px solid #e5e7eb; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { font-size: 12px; padding: 11px 18px; background: transparent; border: none; border-bottom: 3px solid transparent; color: #6b7280; cursor: pointer; white-space: nowrap; }
    .tab.active { color: #0052cc; border-bottom-color: #0052cc; font-weight: 800; }

    /* ── Divider ──────────────────────────────────────────── */
    .divider { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .divider-badge { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .09em; padding: 5px 13px; border-radius: 999px; white-space: nowrap; }
    .divider-line { flex: 1; height: 1px; background: #e5e7eb; }

    /* ── Cards ────────────────────────────────────────────── */
    .card { border: 1px solid #e5e7eb; border-radius: 14px; overflow: hidden; background: white; margin-bottom: 16px; }
    .card-pad { padding: 20px 24px; }

    /* ── REQ 2: Unified module card (matches Workflow Steps) ─
       Same visual system: white bg, border, gradient header,
       consistent padding, radius, shadow, typography
    ──────────────────────────────────────────────────────── */
    .module-card { border: 1px solid #e5e7eb; border-radius: 14px; overflow: hidden; background: white; margin-bottom: 16px; }
    .module-head { padding: 16px 24px 14px; border-bottom: 1px solid #e5e7eb; background: linear-gradient(135deg, #f0f4ff, #fafbff); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .module-head-sub   { font-size: 9.5px; color: #0052cc; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 3px; }
    .module-head-title { font-size: 15px; font-weight: 900; color: #111827; letter-spacing: -.02em; }
    .module-body { padding: 20px 24px; }

    /* ── Brands ───────────────────────────────────────────── */
    .grid-brands { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
    .brand-btn { height: 60px; border-radius: 8px; border: 1px solid #e5e7eb; background: white; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: 800; font-size: 11px; color: #111827; }
    .brand-btn.active { border: 2px solid #534ab7; background: #eeedfe; color: #3c3489; box-shadow: 0 0 0 3px #534ab722; }

    /* ── Chips ────────────────────────────────────────────── */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { font-size: 11px; padding: 5px 13px; border-radius: 999px; cursor: pointer; border: 1px solid #e5e7eb; background: transparent; color: #6b7280; }
    .chip.market-active { font-weight: 800; color: #111827; border-color: #9ca3af; background: transparent; }
    .chip.active { background: #eeedfe; border-color: #534ab7; color: #3c3489; font-weight: 700; }

    /* ── Use case cards ───────────────────────────────────── */
    .use-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 8px; }
    .use-card { text-align: left; padding: 12px; border-radius: 10px; cursor: pointer; border: 1px solid #e5e7eb; background: white; }
    .use-card.active { border: 2px solid #534ab7; background: #eeedfe; }
    .use-title  { font-size: 11px; font-weight: 800; margin-bottom: 3px; line-height: 1.3; }
    .use-domain { font-size: 9.5px; color: #6b7280; margin-bottom: 4px; }
    .use-desc   { font-size: 9.5px; color: #6b7280; line-height: 1.4; opacity: .85; }

    /* ── Section nav ──────────────────────────────────────── */
    .sec-nav { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 24px; background: #f0f4ff; border: 1px solid #0052cc30; border-radius: 10px; padding: 8px 12px; }
    .sec-nav button { padding: 6px 14px; border-radius: 999px; border: 0; background: white; color: #0052cc; cursor: pointer; font-size: 11px; font-weight: 700; }

    /* ── Workflow strip ───────────────────────────────────── */
    .workflow-head { padding: 20px 24px 16px; border-bottom: 1px solid #e5e7eb; background: linear-gradient(135deg, #f0f4ff, #fafbff); }
    .eyebrow { font-size: 9.5px; color: #0052cc; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 5px; }
    .workflow-title { font-size: 28px; font-weight: 900; color: #111827; letter-spacing: -.03em; line-height: 1.1; margin-bottom: 12px; }
    .pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 10px; font-size: 10px; font-weight: 700; margin-right: 6px; margin-bottom: 4px; }
    .workflow-strip { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; overflow-x: auto; }
    .steps { display: flex; align-items: stretch; min-width: 900px; }
    .step { width: 190px; background: white; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.07); overflow: hidden; flex: 0 0 auto; }
    .step-bar  { height: 4px; }
    .step-body { padding: 13px 14px 15px; }
    .step-badge { display: inline-flex; font-size: 9px; font-weight: 900; padding: 3px 8px; border-radius: 999px; margin-bottom: 8px; }
    .step-name { font-size: 13px; font-weight: 900; margin-bottom: 5px; }
    .step-tool { font-size: 10px; font-weight: 800; margin-bottom: 7px; }
    .step-desc { font-size: 10px; color: #6b7280; line-height: 1.5; }
    .arrow { width: 44px; display: flex; align-items: center; justify-content: center; color: #10b981; font-weight: 900; }

    /* ── Table ────────────────────────────────────────────── */
    table { width: 100%; border-collapse: collapse; font-size: 11px; min-width: 560px; }
    th { text-align: center; padding: 10px; color: #6b7280; font-size: 10px; font-weight: 600; background: #f8fafc; border-bottom: 1px solid #e5e7eb; }
    th:first-child, td:first-child { text-align: left; }
    td { text-align: center; padding: 11px 10px; border-bottom: 1px solid #e5e7eb; }
    .score { border-radius: 999px; padding: 2px 9px; font-size: 10px; font-weight: 800; }

    /* ── Feature cards (REQ 2 standardised) ──────────────── */
    .feature-card { border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; margin-bottom: 10px; background: white; }
    .feature-head { padding: 10px 14px; border-bottom: 1px solid #e5e7eb; display: flex; gap: 10px; align-items: center; background: linear-gradient(135deg, #f8fafc, #ffffff); }
    .feature-body { padding: 16px 18px; font-size: 11.5px; color: #6b7280; line-height: 1.7; }

    /* ── Tips (REQ 2 standardised) ───────────────────────── */
    .tips-list { display: flex; flex-direction: column; gap: 8px; }
    .tip-row { display: flex; gap: 14px; align-items: flex-start; padding: 12px 16px; background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 10px; font-size: 12px; line-height: 1.7; }
    .tip-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: #0052cc; min-width: 100px; padding-top: 2px; flex-shrink: 0; }

    /* ── Legal (REQ 2 standardised) ──────────────────────── */
    .legal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .legal-card { border-radius: 12px; overflow: hidden; border: 1px solid #e5e7eb; background: white; }
    .legal-head { padding: 14px 16px 12px; background: linear-gradient(135deg, #f0f4ff, #fafbff); border-bottom: 1px solid #e5e7eb; }
    .legal-head-label { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 3px; }
    .legal-head-title { font-size: 14px; font-weight: 900; color: #111827; }
    .legal-body { padding: 14px 16px; font-size: 11.5px; color: #374151; line-height: 1.65; }
    .legal-item { display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-start; }
    .legal-dot  { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; margin-top: 6px; }
    .notice { margin-top: 16px; padding: 14px 18px; background: #f8fafc; border: 1px solid #e5e7eb; border-left: 4px solid #003884; border-radius: 8px; }
    .notice-title { font-size: 10px; font-weight: 900; color: #003884; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 6px; }
    .notice p { margin: 0; font-size: 11px; color: #374151; line-height: 1.85; }

    /* ── Benchmark inner tabs ─────────────────────────────── */
    .bench-inner-tabs { display: flex; border-bottom: 1px solid #e5e7eb; background: #f8fafc; overflow-x: auto; scrollbar-width: none; }
    .bench-inner-tabs::-webkit-scrollbar { display: none; }
    .bench-inner-tab { font-size: 11px; padding: 10px 16px; background: transparent; border: none; border-bottom: 2px solid transparent; color: #6b7280; cursor: pointer; white-space: nowrap; font-weight: 600; }
    .bench-inner-tab.active { color: #0052cc; border-bottom-color: #0052cc; font-weight: 800; background: white; }
    .bench-tab-content { padding: 16px; }

    /* ── Model cards ──────────────────────────────────────── */
    .model-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .model-card { background: #fafafa; border: 1.5px solid #e5e7eb; border-radius: 8px; padding: 10px 12px; cursor: pointer; }
    .model-card:hover { border-color: #bfdbfe; }
    .model-card.active { background: #f0f7ff; border-color: #93c5fd; }
    .model-link { display: inline-flex; align-items: center; gap: 3px; font-size: 9px; color: #0052cc; font-weight: 700; text-decoration: none; margin-top: 5px; opacity: .75; }
    .model-link:hover { opacity: 1; text-decoration: underline; }
    .check { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid #d1d5db; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; }
    .check.active { background: #0052cc; color: white; border-color: #0052cc; }
    .radio-circle { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #d1d5db; display: inline-flex; align-items: center; justify-content: center; font-size: 8px; flex-shrink: 0; }
    .radio-circle.active { background: #0052cc; color: white; border-color: #0052cc; }

    /* ── Criteria ─────────────────────────────────────────── */
    .criteria-group { border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; margin-bottom: 10px; background: white; }
    .criteria-group-head { padding: 10px 14px; background: #f8fafc; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .criteria-group-title { font-size: 12px; font-weight: 800; color: #111827; }
    .criteria-weight { font-size: 10px; font-weight: 700; color: #0052cc; background: #e6f0ff; border-radius: 999px; padding: 2px 8px; }
    .criteria-items { padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
    .criteria-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; cursor: pointer; border: 1px solid #e5e7eb; background: #fafafa; font-size: 11.5px; }
    .criteria-item.active { background: #f0f7ff; border-color: #93c5fd; color: #1d4ed8; font-weight: 600; }

    /* ── Use case list ────────────────────────────────────── */
    .bench-usecase-grid { display: grid; grid-template-columns: 1fr; gap: 6px; }
    .bench-usecase-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; border: 1px solid #e5e7eb; background: #fafafa; }
    .bench-usecase-item.active { background: #f0f7ff; border-color: #93c5fd; }
    .bench-usecase-text strong { font-size: 11.5px; font-weight: 800; display: block; margin-bottom: 2px; }
    .bench-usecase-text span   { font-size: 10px; color: #6b7280; line-height: 1.4; }

    /* ── Context ──────────────────────────────────────────── */
    .context-section { margin-bottom: 20px; }
    .context-label   { font-size: 12px; font-weight: 800; color: #111827; margin-bottom: 10px; }
    .volume-chips    { display: flex; flex-wrap: wrap; gap: 6px; }
    .context-textarea { width: 100%; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 12px; font-size: 12px; color: #374151; resize: vertical; min-height: 90px; outline: none; line-height: 1.6; }
    .context-textarea:focus { border-color: #93c5fd; box-shadow: 0 0 0 3px #dbeafe; }

    /* ── Prompt box ───────────────────────────────────────── */
    .prompt-box { background: #0f172a; border-radius: 10px; padding: 20px; font-size: 11px; color: #e2e8f0; line-height: 1.8; font-family: 'Menlo','Consolas',monospace; white-space: pre-wrap; word-break: break-word; min-height: 300px; }
    .copy-btn { background: #0052cc; color: white; border: none; border-radius: 7px; padding: 9px 20px; font-size: 12px; font-weight: 800; cursor: pointer; margin-bottom: 14px; }
    .copy-btn:hover { background: #003fa3; }
    .copy-btn.copied { background: #0f6e56; }

    /* ── Results ──────────────────────────────────────────── */
    .result-card { border: 1px solid #e5e7eb; border-radius: 12px; background: white; overflow: hidden; margin-bottom: 12px; }
    .result-head { padding: 12px 16px 10px; border-bottom: 1px solid #e5e7eb; background: #fafafa; display: flex; justify-content: space-between; align-items: center; }
    .bar { height: 4px; background: #e5e7eb; border-radius: 4px; overflow: hidden; }
    .bar div { height: 100%; border-radius: 4px; }

    /* ── Tools library ────────────────────────────────────── */
    .tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .tool-card { background: white; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; }
    .tool-head { padding: 14px 16px 12px; border-bottom: 1px solid #e5e7eb; }
    .tag { border-radius: 4px; padding: 2px 7px; font-size: 9px; font-weight: 900; }

    /* ── Responsive ───────────────────────────────────────── */
    @media (max-width: 800px) {
      .brand-mark { position: static; align-items: flex-start; margin-bottom: 10px; }
      .hero-copy  { padding-right: 0; }
      .hero-pills .sep { display: none; }
      .hero-pills { gap: 10px; }
      .grid-brands { grid-template-columns: repeat(3, 1fr); }
      .legal-grid  { grid-template-columns: 1fr; }
      .model-grid  { grid-template-columns: 1fr; }
    }
  </style>
</head>

    function Divider({label,color="#0052CC"}) {
      return <div className="divider">
        <span className="divider-badge" style={{color,background:color+"14",border:`1px solid ${color}35`}}>{label}</span>
        <div className="divider-line"/>
      </div>;
    }
    function Pill({label,bg,fg}) { return <span className="pill" style={{background:bg,color:fg}}>{label}</span>; }
    function scoreStyle(v) {
      if(v>=85) return {background:"#E1F5EE",color:"#085041"};
      if(v>=70) return {background:"#FEF3C7",color:"#633806"};
      return {background:"#FAECE7",color:"#712B13"};
    }

    // REQ 3/4: Adobe uses same neutral blue as all other groups (no red/orange).
    // ENTERPRISE badge: purple, matching Microsoft Copilot (M365) exactly.
    // REQ 6: Learn more link on every model card.
    function ModelCard({m, selected, toggle}) {
      const isActive = selected.includes(m.id);
      const isEnt = m.tag==="ENTERPRISE";
      const tagBg    = isEnt ? "#F5F3FF" : "#EFF6FF";
      const tagColor = isEnt ? "#5B21B6" : "#1D4ED8";
      const tagBdr   = isEnt ? "#DDD6FE" : "#BFDBFE";
      return <div className={"model-card "+(isActive?"active":"")} onClick={()=>toggle(m.id)}>
        <div style={{display:"flex",justifyContent:"space-between",gap:8}}>
          <div>
            <strong style={{fontSize:11}}>{m.name}</strong>
            <div style={{fontSize:10,color:"#0052CC",fontWeight:800,marginTop:2}}>{m.vendor}</div>
          </div>
          <span className={"check "+(isActive?"active":"")}>{isActive?"✓":""}</span>
        </div>
        <div style={{marginTop:6,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <span className="tag" style={{background:tagBg,color:tagColor,border:`1px solid ${tagBdr}`}}>{m.tag}</span>
          {m.url && <a href={m.url} target="_blank" rel="noopener noreferrer" className="model-link" onClick={e=>e.stopPropagation()}>Learn more ↗</a>}
        </div>
      </div>;
    }

    function CriteriaTabGeneric({criteria, selectedCriteria, toggleCriterion}) {
      const toggleAll = (group) => {
        const ids = group.items.map(i=>i.id);
        const allSel = ids.every(id=>selectedCriteria.includes(id));
        ids.forEach(id=>{
          if(allSel && selectedCriteria.includes(id)) toggleCriterion(id);
          if(!allSel && !selectedCriteria.includes(id)) toggleCriterion(id);
        });
      };
      return <div className="bench-tab-content">
        {criteria.map(group=>{
          const allSel  = group.items.every(i=>selectedCriteria.includes(i.id));
          const someSel = group.items.some(i=>selectedCriteria.includes(i.id));
          return <div className="criteria-group" key={group.id}>
            <div className="criteria-group-head" onClick={()=>toggleAll(group)}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <span className={"check "+(allSel?"active":"")}>{allSel?"✓":someSel?"–":""}</span>
                <div>
                  <span className="criteria-group-title">{group.label}</span>
                  {group.desc && <span style={{fontSize:10,color:"#6B7280",marginLeft:8}}>{group.desc}</span>}
                </div>
              </div>
              <span className="criteria-weight">{group.weight}</span>
            </div>
            <div className="criteria-items">
              {group.items.map(item=><div key={item.id} className={"criteria-item "+(selectedCriteria.includes(item.id)?"active":"")} onClick={()=>toggleCriterion(item.id)}>
                <span className={"check "+(selectedCriteria.includes(item.id)?"active":"")}>{selectedCriteria.includes(item.id)?"✓":""}</span>
                {item.label}
              </div>)}
            </div>
          </div>;
        })}
      </div>;
    }

    function UseCaseTabGeneric({useCases, selectedUseCase, setSelectedUseCase}) {

        <div style={{fontSize:11,color:"#6b7280",marginBottom:12}}>Select one use case for this benchmark (single-select)</div>
        <div className="bench-usecase-grid">
          {useCases.map((uc,idx)=><div key={uc.id} className={"bench-usecase-item "+(selectedUseCase===uc.id?"active":"")} onClick={()=>setSelectedUseCase(selectedUseCase===uc.id?null:uc.id)}>
            <span className={"radio-circle "+(selectedUseCase===uc.id?"active":"")}>{selectedUseCase===uc.id?"●":""}</span>
            <div className="bench-usecase-text"><strong>{idx+1}. {uc.label}</strong><span>{uc.desc}</span></div>
          </div>)}
        </div>
      </div>;

    function ContextTab({dailyVolume, setDailyVolume, reviewerContext, setReviewerContext, volumes, placeholder}) {
      const vols = volumes || DAILY_VOLUMES;

        <div className="context-section">
          <div className="context-label">Expected Daily Volume</div>
          <div className="volume-chips">{vols.map(v=><button key={v} className={"chip "+(dailyVolume===v?"active":"")} onClick={()=>setDailyVolume(v)}>{v}</button>)}</div>
        </div>
        <div className="context-section">
          <div className="context-label">Additional Reviewer Context</div>
          <textarea className="context-textarea" value={reviewerContext} onChange={e=>setReviewerContext(e.target.value)} placeholder={ph} rows={5}/>
        </div>
      </div>;
    }

    function buildImagePrompt(p) {
      const modelNames  = p.selectedModels.length ? ALL_BENCH_MODELS.filter(m=>p.selectedModels.includes(m.id)).map(m=>`${m.name} (${m.vendor})`).join(", ") : "No models selected";
      const ucObj       = BENCH_USE_CASES.find(u=>u.id===p.selectedUseCase);
      const ucName      = ucObj ? `${ucObj.label}\n  "${ucObj.desc}"` : "No use case selected";
      const criteria    = BENCHMARK_CRITERIA.map(g=>{const c=g.items.filter(i=>p.selectedCriteria.includes(i.id));return c.length?`  - ${g.label} (${g.weight}): ${c.map(x=>x.label).join(", ")}`:null;}).filter(Boolean).join("\n") || "  No criteria selected";
      const vol         = p.dailyVolume || "Not specified";
      const ctx         = p.reviewerContext.trim() || "None provided";
      const results     = p.benchmarkResults&&p.benchmarkResults.length ? p.benchmarkResults.map((r,i)=>`  ${i+1}. ${r.name} — ${r.overall}/100`).join("\n") : "  Not yet run";
      return `# Image Models Benchmark Prompt\n\nYou are an expert image model evaluator for fashion and e-commerce. Benchmark the models below against the specified use case and criteria.\n\n## Models\n${modelNames}\n\n## Use Case\n${ucName}\n\n## Criteria & Weights\n${criteria}\n\n## Volume\n${vol}\n\n## Reviewer Context\n${ctx}\n\n## Existing Results\n${results}\n\n## Instructions\n1. Score each criterion 0–100.\n2. Apply category weights to produce a final score per model.\n3. Flag models scoring below 60 in any category weighted >=15% as critical risk.\n4. Provide strengths, weaknesses, and recommended use cases per model.\n5. Rank all models and provide a Top Pick and Best Value recommendation.\n\n*Generated by GenAI Media Benchmark Tool — BESTSELLER Tech Creative Solutions*`;
    }

    function buildVideoPrompt(p) {
      const modelNames  = p.selectedModels.length ? ALL_VIDEO_MODELS.filter(m=>p.selectedModels.includes(m.id)).map(m=>`${m.name} (${m.vendor})`).join("\n  - ") : "No models selected";
      const ucObj       = VIDEO_USE_CASES.find(u=>u.id===p.selectedUseCase);
      const ucName      = ucObj ? `${ucObj.label}\n  "${ucObj.desc}"` : "No use case selected";
      const criteria    = VIDEO_CRITERIA.map(g=>{const c=g.items.filter(i=>p.selectedCriteria.includes(i.id));return c.length?`  - ${g.label} (${g.weight}): ${c.map(x=>x.label).join(", ")}`:null;}).filter(Boolean).join("\n") || "  No criteria selected";
      const vol         = p.dailyVolume || "Not specified";
      const ctx         = p.reviewerContext.trim() || "None provided";
      const results     = p.benchmarkResults&&p.benchmarkResults.length ? p.benchmarkResults.map((r,i)=>`  ${i+1}. ${r.name} — ${r.overall}/100`).join("\n") : "  Not yet run";
      return `# Video Models Benchmark Prompt\n\nYou are an expert video model benchmark evaluator for fashion, e-commerce, and brand marketing. Benchmark the selected models against the specified use case and criteria.\n\n## Selected Models\n  - ${modelNames}\n\n## Use Case\n${ucName}\n\n## Daily Volume\n${vol}\n\n## Reviewer Context\n${ctx}\n\n## Criteria & Weights\n${criteria}\n\n## Existing Results\n${results}\n\n## Instructions\n1. Score each criterion 1–10.\n2. Apply weights to produce a final score per model.\n3. Flag models below 6/10 in any category weighted >=15% as critical risk.\n4. Tie-break: (i) product fidelity, (ii) consistency, (iii) efficiency.\n5. Output: executive summary, ranked table, per-criterion scores, strengths/weaknesses, best for use case, best for scale, best for brand safety, risks, final recommendation, next test plan.\n\n*Generated by GenAI Media Benchmark Tool — BESTSELLER Tech Creative Solutions*`;
    }

    function CopyPromptTabGeneric({prompt, allModels, selectedModels, selectedCriteria, selectedUseCase, dailyVolume, useCases}) {
      const [copied,setCopied] = useState(false);
      const handleCopy = () => { navigator.clipboard.writeText(prompt).then(()=>{ setCopied(true); setTimeout(()=>setCopied(false),2000); }); };
      const selM = allModels.filter(m=>selectedModels.includes(m.id));
      const ucObj = useCases.find(u=>u.id===selectedUseCase);
      return <div style={{padding:20}}>
        <Divider label="Benchmark Configuration Summary" color="#0052CC"/>
        <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:16}}>
          <span className="pill" style={{background:"#EFF6FF",color:"#1D4ED8"}}>{selM.length>0?`${selM.length} models selected`:"No models selected"}</span>
          <span className="pill" style={{background:"#F5F3FF",color:"#5B21B6"}}>{selectedCriteria.length>0?`${selectedCriteria.length} criteria selected`:"No criteria selected"}</span>
          <span className="pill" style={{background:"#ECFDF5",color:"#065F46"}}>{ucObj?ucObj.label:"No use case selected"}</span>
          {dailyVolume && <span className="pill" style={{background:"#FFF7ED",color:"#9A3412"}}>{dailyVolume}</span>}
        </div>
        <button className={"copy-btn"+(copied?" copied":"")} onClick={handleCopy}>{copied?"Copied to clipboard!":"Copy Benchmark Prompt"}</button>
        <div className="prompt-box">{prompt}</div>
      </div>;
    }

    // ════════════════════════════════════════════════════════
    // BENCHMARK COMPONENT
    // ════════════════════════════════════════════════════════
    function Benchmark({kind}) {
      const isImage = kind==="image";
      const [selectedModels,setSelectedModels]     = useState([]);
      const [selectedCriteria,setSelectedCriteria] = useState([]);
      const [selectedUseCase,setSelectedUseCase]   = useState(null);
      const [dailyVolume,setDailyVolume]           = useState(null);
      const [reviewerContext,setReviewerContext]   = useState("");
      const [benchmarkResults,setBenchmarkResults] = useState(null);
      const [innerTab,setInnerTab]                 = useState("models");

      const toggleModel     = id=>setSelectedModels(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
      const toggleCriterion = id=>setSelectedCriteria(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);

      const allModels = isImage ? ALL_BENCH_MODELS : ALL_VIDEO_MODELS;
      const imgAxes   = [["quality","Quality"],["speed","Speed"],["cost","Cost"],["ip","IP Safety"],["fashion","Fashion"],["enterprise","Enterprise"]];
      const vidAxes   = [["fidelity","Fidelity"],["p2v","Product-to-Video"],["motion","Motion"],["consistency","Consistency"],["safety","Brand Safety"],["marketing","Marketing"]];
      const axes = isImage ? imgAxes : vidAxes;

      const runBenchmark = () => {
        const chosen = allModels.filter(m=>selectedModels.includes(m.id));
        const res = chosen.map((m,idx)=>{
          const scores={};
          axes.forEach((a,i)=>scores[a[0]]=Math.max(58,Math.min(98,84-idx*3+((m.name.length+i*7)%13)-6)));
          const overall=Math.round(Object.values(scores).reduce((a,b)=>a+b,0)/axes.length);
          return {...m,scores,overall};
        }).sort((a,b)=>b.overall-a.overall);
        setBenchmarkResults(res);
        setInnerTab("results");
      };

      const innerTabs = [
        {id:"models",  label:"Models"},
        {id:"criteria",label:"Criteria"},
        {id:"usecase", label:"Use case"},
        {id:"context", label:"Context"},
        {id:"results", label:"Benchmark Results"},
        {id:"prompt",  label:"Copy Benchmark Prompt"},
      ];

      const p = {selectedModels,selectedCriteria,selectedUseCase,dailyVolume,reviewerContext,benchmarkResults};
      const prompt = isImage ? buildImagePrompt(p) : buildVideoPrompt(p);

      return <section>
        <div style={{background:"white",border:"1px solid #e5e7eb",borderRadius:12,overflow:"hidden"}}>
          <div style={{background:"white",borderBottom:"1px solid #e5e7eb",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 20px",height:48}}>
            <strong style={{fontSize:12}}>{isImage?"Image":"Video"} Models Benchmark Tool</strong>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              {selectedModels.length>0   && <span className="pill" style={{background:"#DBEAFE",color:"#1D4ED8"}}>{selectedModels.length} models</span>}
              {selectedCriteria.length>0 && <span className="pill" style={{background:"#F5F3FF",color:"#5B21B6"}}>{selectedCriteria.length} criteria</span>}
              {selectedUseCase           && <span className="pill" style={{background:"#ECFDF5",color:"#065F46"}}>use case</span>}
              <button onClick={runBenchmark} disabled={!selectedModels.length} style={{background:selectedModels.length?C.blue:"#F3F4F6",color:selectedModels.length?"white":"#9CA3AF",border:0,borderRadius:7,padding:"8px 16px",fontWeight:900,cursor:selectedModels.length?"pointer":"not-allowed"}}>Benchmark Models</button>
            </div>
          </div>
          <div className="bench-inner-tabs">
            {innerTabs.map(t=><button key={t.id} className={"bench-inner-tab "+(innerTab===t.id?"active":"")} onClick={()=>setInnerTab(t.id)}>
              {t.label}{t.id==="results"&&benchmarkResults?<span className="pill" style={{marginLeft:6,background:"#DCFCE7",color:"#166534",padding:"1px 6px",fontSize:9}}>done</span>:null}
            </button>)}
          </div>
          {innerTab==="models" && (isImage
            ? <ModelsTabGeneric standalone={IMG_STANDALONE} adobe={IMG_ADOBE} figma={IMG_FIGMA} selected={selectedModels} toggle={toggleModel}/>
            : <ModelsTabGeneric standalone={VID_STANDALONE} adobe={VID_ADOBE} figma={VID_FIGMA} selected={selectedModels} toggle={toggleModel}/>
          )}
          {innerTab==="criteria" && (isImage
            ? <CriteriaTabGeneric criteria={BENCHMARK_CRITERIA} selectedCriteria={selectedCriteria} toggleCriterion={toggleCriterion}/>
            : <CriteriaTabGeneric criteria={VIDEO_CRITERIA}     selectedCriteria={selectedCriteria} toggleCriterion={toggleCriterion}/>
          )}
          {innerTab==="usecase" && (isImage
            ? <UseCaseTabGeneric useCases={BENCH_USE_CASES}   selectedUseCase={selectedUseCase} setSelectedUseCase={setSelectedUseCase}/>
            : <UseCaseTabGeneric useCases={VIDEO_USE_CASES}   selectedUseCase={selectedUseCase} setSelectedUseCase={setSelectedUseCase}/>
          )}
          {innerTab==="context" && <ContextTab dailyVolume={dailyVolume} setDailyVolume={setDailyVolume} reviewerContext={reviewerContext} setReviewerContext={setReviewerContext}
            volumes={isImage?DAILY_VOLUMES:VIDEO_DAILY_VOLUMES}
            placeholder={isImage?undefined:"Evaluating for an automated product video pipeline. Speed and brand consistency are primary."}
          />}
          {innerTab==="results" && <div style={{padding:24,minHeight:400}}>
            {!benchmarkResults && <div style={{display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",color:"#9CA3AF",textAlign:"center",minHeight:300}}>
              <div style={{fontSize:36}}>+</div><strong>No benchmark yet</strong>
              <div style={{fontSize:12}}>Select models and click Benchmark Models</div>
            </div>}
            {benchmarkResults && <>
              <h2 style={{marginTop:0}}>Model Comparison Results</h2>
              <p style={{fontSize:12,color:"#6B7280"}}>{benchmarkResults.length} models · {isImage?"Image":"Video"} · {dailyVolume||"volume not set"}</p>
              {benchmarkResults.map((r,i)=><div className="result-card" key={r.id}>
                <div className="result-head">
                  <div><strong>{i+1}. {r.name}</strong><div style={{fontSize:10,color:"#6B7280"}}>{r.vendor}</div></div>
                  <div style={{fontSize:22,fontWeight:900,color:r.overall>=80?C.green:C.amber}}>{r.overall}</div>
                </div>
                <div style={{padding:16,display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px 18px"}}>
                  {axes.map(a=><div key={a[0]}>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#6B7280",marginBottom:3}}><span>{a[1]}</span><strong>{r.scores[a[0]]}</strong></div>
                    <div className="bar"><div style={{width:r.scores[a[0]]+"%",background:r.scores[a[0]]>=80?"#10B981":"#F59E0B"}}/></div>
                  </div>)}
                </div>
                <div style={{margin:"0 16px 16px",background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:8,padding:"8px 12px",fontSize:11,color:"#166534"}}>Best suited for fashion/e-commerce production with human QA and governance review.</div>
              </div>)}
            </>}
          </div>}
          {innerTab==="prompt" && <CopyPromptTabGeneric
            prompt={prompt} allModels={allModels}
            selectedModels={selectedModels} selectedCriteria={selectedCriteria}
            selectedUseCase={selectedUseCase} dailyVolume={dailyVolume}
            useCases={isImage?BENCH_USE_CASES:VIDEO_USE_CASES}
          />}
        </div>
      </section>;
    }

    // ════════════════════════════════════════════════════════
    // HEADER
    // ════════════════════════════════════════════════════════
    function Header() {
      return <header className="header">
        <div className="brand-mark">
          <div className="brand-top"><strong>BESTSELLER</strong><span>TECH</span></div>
          <div className="brand-sub">TECH CREATIVE SOLUTIONS</div>
        </div>
        <div className="hero-copy">
          <div className="hero-title"><span className="genai">GenAI</span><span className="media">Media</span></div>
          <div className="hero-sub">Workflow &amp; Benchmark Tools</div>
          <div className="hero-pills">
            <span>AI WORKFLOW GUIDANCE</span><i className="sep"/>
            <span>AI MODELS COMPARISON</span><i className="sep"/>
            <span>AI TOOLS GOVERNANCE</span>
          </div>
        </div>
      </header>;
    }

    // ════════════════════════════════════════════════════════
    // ANALYZER — Use Case → Workflow
    // REQ 2: all info modules match Workflow Steps card style
    // ════════════════════════════════════════════════════════
    function Analyzer() {
      const [brand,setBrand]   = useState(null);
      const [market,setMarket] = useState("Global");
      const [uc,setUC]         = useState("lookbook");
      const w = WF[uc];
      const colors = ["#6366F1","#10B981","#F59E0B","#EC4899"];

      return <main>
        <section style={{marginBottom:24}}>
          <Divider label="Brand" color="#534AB7"/>
          {[0,7,14].map(start=><div className="grid-brands" key={start}>
            {BRANDS.slice(start,start+7).map(b=><button key={b} className={"brand-btn "+(brand===b?"active":"")} onClick={()=>setBrand(brand===b?null:b)}>{b}</button>)}
          </div>)}
        </section>

        <section style={{marginBottom:24}}>
          <Divider label="Market" color="#534AB7"/>
          <div className="chips">
            {MARKETS.map(m=><button key={m} className={"chip "+(market===m?"market-active":"")} onClick={()=>setMarket(m)}>{m}</button>)}
          </div>
        </section>

        <section style={{marginBottom:24}}>
          <Divider label="Use Case" color="#534AB7"/>
          <div className="use-grid">
            {USE_CASES.map(u=><button key={u.id} className={"use-card "+(uc===u.id?"active":"")} onClick={()=>setUC(u.id)}>
              <div className="use-title">{u.label}</div>
              <div className="use-domain">{u.domain}</div>
              <div className="use-desc">{u.desc}</div>
            </button>)}
          </div>
        </section>

        <nav className="sec-nav">
          {["Workflow","Tools Benchmark Info","Workflow Tools Features","AI Tips","AI Legal Guidelines"].map(x=><button key={x} onClick={()=>document.getElementById(x).scrollIntoView({behavior:"smooth",block:"start"})}>{x}</button>)}
        </nav>

        {/* Workflow Steps — reference component */}
        <section className="card" id="Workflow">
          <div className="workflow-head">
            <div className="eyebrow">Selected Workflow</div>
            <div className="workflow-title">{w.label}</div>
            <div>
              {brand && <Pill label={brand} bg="#EEEDFE" fg="#3C3489"/>}
              {market!=="Global" && <Pill label={market} bg="#E6F1FB" fg="#0C447C"/>}
              {w.tools.map(t=><Pill key={t} label={t} bg="#0052CC12" fg="#0052CC"/>)}
            </div>
          </div>
          <div className="card-pad">
            <Divider label="Workflow Steps"/>
            <div className="workflow-strip">
              <div className="steps">
                {w.steps.map((s,i)=><React.Fragment key={s[0]}>
                  <div className="step">
                    <div className="step-bar" style={{background:colors[i%colors.length]}}/>
                    <div className="step-body">
                      <div className="step-badge" style={{background:colors[i%colors.length]+"18",color:colors[i%colors.length]}}>STEP {i+1}</div>
                      <div className="step-name">{s[0]}</div>
                      <div className="step-tool" style={{color:colors[i%colors.length]}}>{s[1]}</div>
                      <div className="step-desc">{s[2]}</div>
                    </div>
                  </div>
                  {i<w.steps.length-1 && <div className="arrow">→</div>}
                </React.Fragment>)}
              </div>
            </div>
          </div>
        </section>

        {/* REQ 2: Tools Benchmark Info — module-card style */}
        <section className="module-card" id="Tools Benchmark Info">
          <div className="module-head">
            <div>
              <div className="module-head-sub">Performance Overview</div>
              <div className="module-head-title">Tools Benchmark Info</div>
            </div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {w.tools.map(t=><Pill key={t} label={t} bg="#0052CC12" fg="#0052CC"/>)}
            </div>
          </div>
          <div className="module-body" style={{overflowX:"auto"}}>
            <table>
              <thead><tr><th>Tool</th>{AXES.map(a=><th key={a[0]}>{a[1]}</th>)}<th>IP</th><th>API</th></tr></thead>
              <tbody>{w.tools.filter(t=>TOOL_SCORE[t]).map(t=>{
                const d=TOOL_SCORE[t];
                return <tr key={t}>
                  <td style={{fontWeight:800}}>{t}</td>
                  {AXES.map(a=><td key={a[0]}><span className="score" style={scoreStyle(d[a[0]])}>{d[a[0]]}</span></td>)}
                  <td style={{color:"#0F6E56",fontWeight:900}}>✓</td>
                  <td style={{color:"#0F6E56",fontWeight:900}}>✓</td>
                </tr>;
              })}</tbody>
            </table>
          </div>
        </section>

        {/* REQ 2: Workflow Tools Features — module-card style */}
        <section className="module-card" id="Workflow Tools Features">
          <div className="module-head">
            <div>
              <div className="module-head-sub">Step-by-Step Guidance</div>
              <div className="module-head-title">Workflow Tools Features</div>
            </div>
          </div>
          <div className="module-body">
            {w.steps.map((s,i)=><div className="feature-card" key={s[0]}>
              <div className="feature-head" style={{background:colors[i%colors.length]+"08"}}>
                <span className="step-badge" style={{background:colors[i%colors.length]+"20",color:colors[i%colors.length],margin:0}}>STEP {i+1}</span>
                <strong style={{fontSize:12}}>{s[0]}</strong>
                <span style={{fontSize:10,color:colors[i%colors.length],fontWeight:800}}>— {s[1]}</span>
              </div>
              <div className="feature-body">
                <p style={{marginTop:0,marginBottom:10}}>{s[2]}. Use structured inputs, versioned prompts and human review to keep brand quality consistent.</p>
                <ol style={{marginBottom:0,paddingLeft:18,lineHeight:1.8}}>
                  <li>Define the intended output, target channel and brand constraints before generation.</li>
                  <li>Save prompt, seed/model and source-file references for reproducibility.</li>
                  <li>Review fabric, logos, hands/faces, scale, legal claims and final export specs.</li>
                </ol>
              </div>
            </div>)}
          </div>
        </section>

        {/* REQ 2: AI Tips — module-card style */}
        <section className="module-card" id="AI Tips">
          <div className="module-head">
            <div>
              <div className="module-head-sub">Best Practices</div>
              <div className="module-head-title">AI Tips</div>
            </div>
          </div>
          <div className="module-body">
            <div className="tips-list">
              <div className="tip-row"><div className="tip-label">Prompting</div><div>Anchor {w.label} prompts in brand, season, lighting, camera and exclusion rules.</div></div>
              <div className="tip-row"><div className="tip-label">Quality Risk</div><div>Review hands, fabric texture, logos, seams and scale before stakeholder sign-off.</div></div>
              <div className="tip-row"><div className="tip-label">IP Governance</div><div>Use approved or indemnified models for {market}; avoid living artists, celebrities and protected marks.</div></div>
            </div>
            <div style={{fontSize:10,color:"#9CA3AF",marginTop:10}}>Context: {brand||"Selected brand"} · {market}</div>
          </div>
        </section>

        {/* REQ 2: AI Legal Guidelines — module-card style */}
        <section className="module-card" id="AI Legal Guidelines">
          <div className="module-head">
            <div>
              <div className="module-head-sub">Governance Framework</div>
              <div className="module-head-title">AI Legal Guidelines</div>
            </div>
          </div>
          <div className="module-body">
            <div className="legal-grid">
              {[
                {label:"Approved",title:"To Go",       color:"#166534",items:["Use approved tools and keep prompt/output records for auditability.","Apply human QA before commercial publication.",`Check local advertising and consumer-protection rules for ${market}.`]},
                {label:"Prohibited",title:"No Go",      color:"#991B1B",items:["Do not upload confidential personal data into unapproved models.","Do not imitate living artists, celebrities or protected brand marks.","Do not publish outputs with unresolved copyright or model-release issues."]},
                {label:"Best Practice",title:"Recommendations",color:"#1E40AF",items:["Prefer indemnified models for campaign and paid-media work.","Route edge cases through Legal & Compliance before launch.","Maintain a market-specific asset manifest for delivery."]},
              ].map(card=><div className="legal-card" key={card.title}>
                <div className="legal-head">
                  <div className="legal-head-label" style={{color:card.color}}>{card.label}</div>
                  <div className="legal-head-title">{card.title}</div>
                </div>
                <div className="legal-body">
                  {card.items.map((item,i)=><div className="legal-item" key={i}><span className="legal-dot" style={{background:card.color}}/><span>{item}</span></div>)}
                </div>
              </div>)}
            </div>
            <div className="notice">
              <div className="notice-title">Governance &amp; Compliance Notice</div>
              <p>This demo is intended for internal operational reference only and does not constitute formal legal advice. For binding compliance determinations or regulatory interpretation, consult BESTSELLER Legal &amp; Compliance.</p>
            </div>
          </div>
        </section>
      </main>;
    }

    // ════════════════════════════════════════════════════════
    // AI TOOLS LIBRARY
    // REQ 5: filters = Image/Video/Platform/Post-Prod; "AI" stripped from card renders
    // REQ 6: Learn more link on every card
    // ════════════════════════════════════════════════════════
    function Tools() {
      const [filter,setFilter] = useState("All");
      const list = TOOL_LIB.filter(t=>filter==="All"||t[2]===filter);
      const tagStyle = (cat) => {
        if(cat==="Image")     return {background:"#EFF6FF",color:"#1D4ED8",border:"1px solid #BFDBFE"};
        if(cat==="Video")     return {background:"#FFF7ED",color:"#9A3412",border:"1px solid #FED7AA"};
        if(cat==="Platform")  return {background:"#F5F3FF",color:"#5B21B6",border:"1px solid #DDD6FE"};
        if(cat==="Post-Prod") return {background:"#ECFDF5",color:"#065F46",border:"1px solid #A7F3D0"};
        return {background:"#F5F3FF",color:"#5B21B6",border:"1px solid #DDD6FE"};
      };
      return <main>
        <Divider label="Filter by Category"/>
        <div className="chips" style={{marginBottom:24}}>
          {LIB_FILTERS.map(f=><button className={"chip "+(filter===f?"active":"")} key={f} onClick={()=>setFilter(f)}>{f}</button>)}
        </div>
        <div style={{fontSize:11,color:"#6B7280",marginBottom:16}}>{list.length} tool{list.length!==1?"s":""} shown</div>
        <div className="tool-grid">
          {list.map((t,i)=><div className="tool-card" key={t[0]+"-"+i}>
            <div className="tool-head">
              <div style={{display:"flex",justifyContent:"space-between",gap:10,alignItems:"flex-start"}}>
                <strong style={{fontSize:12}}>{t[0]}</strong>
                <span className="tag" style={tagStyle(t[2])}>{t[2]}</span>
              </div>
              <div style={{fontSize:11,color:"#0052CC",fontWeight:800,marginTop:7}}>{t[1]}</div>
            </div>
            <div style={{padding:16,fontSize:12,color:"#6B7280",lineHeight:1.7}}>
              <strong style={{color:"#111827"}}>Capabilities:</strong><br/>{t[3]}<br/><br/>
              <strong style={{color:"#111827"}}>Use cases:</strong><br/>{t[4]}
            </div>
            {t[5] && <div style={{padding:"0 16px 14px"}}>
              <a href={t[5]} target="_blank" rel="noopener noreferrer" style={{fontSize:11,color:"#0052cc",fontWeight:700,textDecoration:"none"}}>Learn more ↗</a>
            </div>}
          </div>)}
        </div>
      </main>;
    }

    // ════════════════════════════════════════════════════════
    // APP — REQ 1: sticky nav shell
    // ════════════════════════════════════════════════════════
    function App() {
      const [page,setPage] = useState("analyzer");
      const pages = [
        ["analyzer","Use Case \u2192 Workflow"],
        ["image","Image Models Benchmark"],
        ["video","Video Models Benchmark"],
        ["tools","Tools Library"],
      ];
      return <div className="app">
        <div className="nav-shell">
          <Header/>
          <div className="tabs">
            {pages.map(p=><button key={p[0]} className={"tab "+(page===p[0]?"active":"")} onClick={()=>setPage(p[0])}>{p[1]}</button>)}
          </div>
        </div>
        <div className="page-content">
          {page==="analyzer" && <Analyzer/>}
          {page==="image"    && <Benchmark kind="image"/>}
          {page==="video"    && <Benchmark kind="video"/>}
          {page==="tools"    && <Tools/>}
        </div>
      </div>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
