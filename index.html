<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f8fafc;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #111827;
    }
    button, input { font-family: inherit; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .app { max-width: 1080px; margin: 0 auto; padding: 20px 18px 56px; }
    .header {
      position: relative;
      margin-bottom: 30px;
      padding-top: 16px;
      padding-bottom: 28px;
      border-bottom: 1px solid #e5e7eb;
      background: #f8fafc;
    }
    .brand-mark {
      position: absolute; top: 16px; right: 0;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
    }
    .brand-top { display: flex; align-items: baseline; line-height: 1; }
    .brand-top strong { font-size: 14px; font-weight: 800; letter-spacing: .12em; }
    .brand-top span { font-size: 14px; font-weight: 300; letter-spacing: .22em; }
    .brand-sub { font-size: 9px; font-weight: 600; letter-spacing: .3em; }

    .hero-title { display: flex; align-items: baseline; line-height: 1; margin-bottom: 12px; }
    .hero-title .genai {
      font-size: clamp(48px, 8vw, 80px);
      font-weight: 800;
      letter-spacing: -.02em;
      background: linear-gradient(150deg, #1633cc 0%, #1a6ef5 60%, #3b8ff7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-title .media {
      margin-left: 20px;
      font-size: clamp(48px, 8vw, 80px);
      font-weight: 300;
      color: #0b1840;
      letter-spacing: -.015em;
    }
    .hero-sub {
      font-size: 14px; font-weight: 300; letter-spacing: .42em;
      color: #0b1840; text-transform: uppercase; margin-bottom: 20px;

    .hero-pills { display: flex; align-items: center; flex-wrap: wrap; }
    .hero-pills span { font-size: 10px; letter-spacing: .2em; color: #4e5f7a; white-space: nowrap; }
    .sep { width: 1px; height: 12px; background: #a0aabf; margin: 0 20px; }
    .tabs { display: flex; overflow-x: auto; border-bottom: 1px solid #e5e7eb; margin-bottom: 28px; background: white; border-radius: 12px 12px 0 0; }
    .tab {
      font-size: 12px; padding: 12px 20px; background: transparent; border: none;
      border-bottom: 3px solid transparent; color: #6b7280; cursor: pointer; white-space: nowrap;
    }
    .tab.active { color: #0052cc; border-bottom-color: #0052cc; font-weight: 800; }
    .divider { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .divider-badge {
      font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .09em;
      padding: 5px 13px; border-radius: 999px; white-space: nowrap;
    }
    .divider-line { flex: 1; height: 1px; background: #e5e7eb; }
    .card {
      border: 1px solid #e5e7eb; border-radius: 14px; overflow: hidden;
      background: white; margin-bottom: 16px;
    }
    .card-pad { padding: 20px 24px; }
    .grid-brands { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
    .brand-btn {
      height: 60px; border-radius: 8px; border: 1px solid #e5e7eb; background: white;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      font-weight: 800; font-size: 11px; color: #111827;

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      font-size: 11px; padding: 5px 13px; border-radius: 999px; cursor: pointer;
      border: 1px solid #e5e7eb; background: transparent; color: #6b7280;
    }
    .chip.active { background: #eeedfe; border-color: #534ab7; color: #3c3489; font-weight: 700; }
    .use-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 8px; }
    .use-card {

    .use-domain { font-size: 9.5px; color: #6b7280; margin-bottom: 4px; }
    .use-desc { font-size: 9.5px; color: #6b7280; line-height: 1.4; opacity: .85; }
    .nav { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 24px; background: #f0f4ff; border: 1px solid #0052cc30; border-radius: 10px; padding: 8px 12px; }
    .nav button { padding: 6px 14px; border-radius: 999px; border: 0; background: white; color: #0052cc; cursor: pointer; font-size: 11px; font-weight: 700; }
    .workflow-head { padding: 20px 24px 16px; border-bottom: 1px solid #e5e7eb; background: linear-gradient(135deg, #f0f4ff, #fafbff); }
    .eyebrow { font-size: 9.5px; color: #0052cc; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 5px; }
    .workflow-title { font-size: 28px; font-weight: 900; color: #111827; letter-spacing: -.03em; line-height: 1.1; margin-bottom: 12px; }
    .pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 10px; font-size: 10px; font-weight: 700; margin-right: 6px; margin-bottom: 4px; }
    .workflow-strip { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; overflow-x: auto; }
    .steps { display: flex; align-items: stretch; min-width: 900px; }
    .step {

    .step-bar { height: 4px; }
    .step-body { padding: 13px 14px 15px; }
    .step-badge { display: inline-flex; font-size: 9px; font-weight: 900; padding: 3px 8px; border-radius: 999px; margin-bottom: 8px; }
    .step-name { font-size: 13px; font-weight: 900; margin-bottom: 5px; }

    .score { border-radius: 999px; padding: 2px 9px; font-size: 10px; font-weight: 800; }

    .legal-head { padding: 12px 16px 10px; color: white; }

    .legal-item { display: flex; gap: 8px; margin-bottom: 8px; }

    .notice { margin-top: 16px; padding: 16px 20px; background: #f8fafc; border: 1px solid #d1d5db; border-left: 4px solid #003884; border-radius: 8px; }
    .notice-title { font-size: 10px; font-weight: 900; color: #003884; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 8px; }

    .bench-top { grid-column: span 2; background: white; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 48px; }
    .bench-side { background: white; border-right: 1px solid #e5e7eb; overflow-y: auto; padding: 16px; }
    .model-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .model-card { background: #fafafa; border: 1.5px solid #e5e7eb; border-radius: 8px; padding: 10px 12px; cursor: pointer; }
    .model-card.active { background: #f0f7ff; border-color: #93c5fd; }
    .check { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid #d1d5db; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }
    .check.active { background: #0052cc; color: white; border-color: #0052cc; }
    .bench-main { display: flex; flex-direction: column; overflow: hidden; background: #f9fafb; }
    .bench-results { flex: 1; overflow: auto; padding: 24px; }
    .result-card { border: 1px solid #e5e7eb; border-radius: 12px; background: white; overflow: hidden; margin-bottom: 12px; }
    .result-head { padding: 12px 16px 10px; border-bottom: 1px solid #e5e7eb; background: #fafafa; display: flex; justify-content: space-between; align-items: center; }
    .bar { height: 4px; background: #e5e7eb; border-radius: 4px; overflow: hidden; }
    .bar div { height: 100%; border-radius: 4px; }
    .tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
    .tool-card { background: white; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; }
    .tool-head { padding: 14px 16px 12px; border-bottom: 1px solid #e5e7eb; }
    .tag { border-radius: 4px; padding: 2px 7px; font-size: 9px; font-weight: 900; }
    @media (max-width: 800px) {
      .brand-mark { position: static; align-items: flex-start; margin-bottom: 20px; }
      .hero-copy { padding-right: 0; }
      .hero-pills .sep { display: none; }
      .hero-pills { gap: 12px; }
      .grid-brands { grid-template-columns: repeat(3, 1fr); }
      .legal-grid, .bench-layout { grid-template-columns: 1fr; height: auto; }
      .bench-top { grid-column: span 1; }
      .bench-side { border-right: 0; }
      .bench-results { min-height: 420px; }
    }
  </style>
</head>

          <Divider label="Brand" color="#534AB7" />
          {[0,7,14].map(start => <div className="grid-brands" key={start}>
            {BRANDS.slice(start,start+7).map(b => <button key={b} className={"brand-btn "+(brand===b?"active":"")} onClick={()=>setBrand(brand===b?null:b)}>{b}</button>)}
          </div>)}
        </section>

        <section style={{marginBottom:24}}>
          <Divider label="Market" color="#534AB7" />
          <div className="chips">{MARKETS.map(m => <button key={m} className={"chip "+(market===m?"active":"")} onClick={()=>setMarket(m)}>{m}</button>)}</div>
        </section>

        <section style={{marginBottom:24}}>
          <Divider label="Use Case" color="#534AB7" />
          <div className="use-grid">{USE_CASES.map(u => <button key={u.id} className={"use-card "+(uc===u.id?"active":"")} onClick={()=>setUC(u.id)}>
            <div className="use-icon">{u.icon}</div><div className="use-title">{u.label}</div><div className="use-domain">{u.domain}</div><div className="use-desc">{u.desc}</div>
          </button>)}</div>
        </section>

        <nav className="nav">
          {["Workflow","Tools Benchmark Info","Workflow Tools Features","AI Tips","AI Legal Guidelines"].map(x => <button key={x} onClick={() => document.getElementById(x).scrollIntoView({behavior:"smooth"})}>{x}</button>)}
        </nav>

        <section className="card" id="Workflow">
          <div className="workflow-head">
            <div className="eyebrow">Selected Workflow</div>
            <div className="workflow-title">{w.label}</div>
            <div>
              {brand && <Pill label={brand} bg="#EEEDFE" fg="#3C3489" />}
              {market !== "Global" && <Pill label={market} bg="#E6F1FB" fg="#0C447C" />}
              {w.tools.map(t => <Pill key={t} label={t} bg="#0052CC12" fg="#0052CC" />)}
            </div>
          </div>
          <div className="card-pad">
            <Divider label="Workflow Steps" />
            <div className="workflow-strip">
              <div className="steps">
                {w.steps.map((s,i) => <React.Fragment key={s[0]}>
                  <div className="step">
                    <div className="step-bar" style={{background:colors[i%colors.length]}} />
                    <div className="step-body">
                      <div className="step-badge" style={{background:colors[i%colors.length]+"18",color:colors[i%colors.length]}}>STEP {i+1}</div>
                      <div className="step-name">{s[0]}</div>
                      <div className="step-tool" style={{color:colors[i%colors.length]}}>{s[1]}</div>
                      <div className="step-desc">{s[2]}</div>
                    </div>
                  </div>
                  {i < w.steps.length - 1 && <div className="arrow">→</div>}
                </React.Fragment>)}
              </div>
            </div>
          </div>
        </section>

        <section className="card" id="Tools Benchmark Info"><div className="card-pad">
          <Divider label="Tools Benchmark Info" color="#185FA5" />
          <div style={{overflowX:"auto"}}>
            <table>
              <thead><tr><th>Tool</th>{AXES.map(a=><th key={a[0]}>{a[1]}</th>)}<th>IP</th><th>API</th></tr></thead>
              <tbody>{w.tools.filter(t=>TOOL_SCORE[t]).map(t => {
                const d = TOOL_SCORE[t];
                return <tr key={t}><td style={{fontWeight:800}}>{t}</td>{AXES.map(a=><td key={a[0]}><span className="score" style={scoreStyle(d[a[0]])}>{d[a[0]]}</span></td>)}<td style={{color:"#0F6E56",fontWeight:900}}>✓</td><td style={{color:"#0F6E56",fontWeight:900}}>✓</td></tr>;
              })}</tbody>
            </table>
          </div>
        </div></section>

        <section className="card" id="Workflow Tools Features"><div className="card-pad">
          <Divider label="Workflow Tools Features" color="#059669" />
          {w.steps.map((s,i) => <div className="feature-card" key={s[0]}>
            <div className="feature-head" style={{background:colors[i%colors.length]+"08"}}>
              <span className="step-badge" style={{background:colors[i%colors.length]+"20",color:colors[i%colors.length], margin:0}}>STEP {i+1}</span>
              <strong>{s[0]}</strong><span style={{fontSize:10,color:colors[i%colors.length],fontWeight:800}}>— {s[1]}</span>
            </div>
            <div className="feature-body">
              <p style={{marginTop:0}}>{s[2]}. Use structured inputs, versioned prompts and human review to keep brand quality consistent.</p>
              <ol style={{marginBottom:0,paddingLeft:18}}>
                <li>Define the intended output, target channel and brand constraints before generation.</li>
                <li>Save prompt, seed/model and source-file references for reproducibility.</li>
                <li>Review fabric, logos, hands/faces, scale, legal claims and final export specs.</li>
              </ol>
            </div>
          </div>)}
        </div></section>

        <section className="card" id="AI Tips"><div className="card-pad">
          <Divider label="AI Tips" color="#7C3AED" />
          <div className="tips">
            <div>✨ <strong>Prompting:</strong> Anchor {w.label} prompts in brand, season, lighting, camera and exclusion rules.</div>
            <div>🔎 <strong>Quality Risk:</strong> Review hands, fabric texture, logos, seams and scale before stakeholder sign-off.</div>
            <div>⚖️ <strong>IP Governance:</strong> Use approved or indemnified models for {market}; avoid living artists, celebrities and protected marks.</div>
            <div style={{fontSize:10,color:"#9CA3AF",marginTop:8}}>Context: {brand || "Selected brand"} · {market}</div>
          </div>
        </div></section>

        <section className="card" id="AI Legal Guidelines"><div className="card-pad">
          <Divider label="AI Legal Guidelines" color="#DC2626" />
          <div className="legal-grid">
            <LegalCard title="To Go" subtitle="Approved practices" color="#166534" bg="#F0FDF4" border="#86EFAC" items={[
              "Use approved tools and keep prompt/output records for auditability.",
              "Apply human QA before commercial publication.",
              `Check local advertising and consumer-protection rules for ${market}.`
            ]} />
            <LegalCard title="No Go" subtitle="Strictly prohibited" color="#991B1B" bg="#FFF1F2" border="#FCA5A5" items={[
              "Do not upload confidential personal data into unapproved models.",
              "Do not imitate living artists, celebrities or protected brand marks.",
              "Do not publish outputs with unresolved copyright or model-release issues."
            ]} />
            <LegalCard title="Recommendations" subtitle="Best practice guidance" color="#1E40AF" bg="#EFF6FF" border="#93C5FD" items={[
              "Prefer indemnified models for campaign and paid-media work.",
              "Route edge cases through Legal & Compliance before launch.",
              "Maintain a market-specific asset manifest for delivery."
            ]} />
          </div>
          <div className="notice">
            <div className="notice-title">Governance &amp; Compliance Notice</div>
            <p>This demo is intended for internal operational reference only and does not constitute formal legal advice. For binding compliance determinations or regulatory interpretation, consult BESTSELLER Legal & Compliance.</p>
          </div>
        </div></section>
      </main>;
    }

    function LegalCard({title,subtitle,color,bg,border,items}) {
      return <div className="legal-card" style={{background:bg,borderColor:border}}>
        <div className="legal-head" style={{background:color}}><strong>{title}</strong><span>{subtitle}</span></div>
        <div className="legal-body">{items.map((item,i)=><div className="legal-item" key={i}><span className="dot" style={{background:color}} /><span>{item}</span></div>)}</div>
      </div>;
    }

    function Benchmark({kind}) {
      const isImage = kind === "image";
      const models = isImage ? IMAGE_MODELS : VIDEO_MODELS;
      const axes = isImage
        ? [["quality","Quality"],["speed","Speed"],["cost","Cost Eff."],["ip","IP Safety"],["fashion","Fashion"],["enterprise","Enterprise"]]
        : [["motion","Motion"],["fashion","Fashion"],["prompt","Prompt"],["temporal","Temporal"],["control","Control"],["cost","Cost Eff."]];
      const [selected,setSelected] = useState([]);
      const [volume,setVolume] = useState(isImage ? 10000 : 500);
      const [results,setResults] = useState(null);
      const toggle = id => setSelected(s => s.includes(id) ? s.filter(x=>x!==id) : [...s,id]);
      const run = () => {
        const chosen = models.filter(m => selected.includes(m.id));
        const res = chosen.map((m,idx) => {
          const scores = {};
          axes.forEach((a,i) => scores[a[0]] = Math.max(58, Math.min(98, 84 - idx*3 + ((m.name.length+i*7)%13)-6)));
          const overall = Math.round(Object.values(scores).reduce((a,b)=>a+b,0)/axes.length);
          return {...m, scores, overall};
        }).sort((a,b)=>b.overall-a.overall);
        setResults(res);
      };
      return <section className="bench-layout">
        <div className="bench-top">
          <strong style={{fontSize:12}}>AI {isImage ? "Image" : "Video"} Models Benchmark Tool</strong>
          <div>
            {selected.length > 0 && <span className="pill" style={{background:"#DBEAFE",color:"#1D4ED8"}}>{selected.length} selected</span>}
            <button onClick={run} disabled={!selected.length} style={{background:selected.length?C.blue:"#F3F4F6",color:selected.length?"white":"#9CA3AF",border:0,borderRadius:7,padding:"8px 16px",fontWeight:900,cursor:selected.length?"pointer":"not-allowed"}}>➣ Benchmark AI Models</button>
          </div>
        </div>
        <aside className="bench-side">
          <div style={{fontSize:12,color:"#6B7280",marginBottom:14}}>Select models to benchmark</div>
          <div className="model-grid">
            {models.map(m => <div key={m.id} className={"model-card "+(selected.includes(m.id)?"active":"")} onClick={()=>toggle(m.id)}>
              <div style={{display:"flex",justifyContent:"space-between",gap:8}}>
                <div><strong style={{fontSize:11}}>{m.name}</strong><div style={{fontSize:10,color:"#0052CC",fontWeight:800,marginTop:2}}>{m.vendor}</div></div>
                <span className={"check "+(selected.includes(m.id)?"active":"")}>{selected.includes(m.id)?"✓":""}</span>
              </div>
              <div style={{marginTop:7}}><span className="tag" style={{background:"#EFF6FF",color:"#1D4ED8",border:"1px solid #BFDBFE"}}>{m.tag}</span></div>
              <div style={{fontSize:10,color:"#6B7280",marginTop:6}}>{m.pricing}</div>
            </div>)}
          </div>
          <div style={{fontSize:12,fontWeight:800,margin:"20px 0 10px"}}>Daily volume</div>
          <div className="chips">{(isImage?[1000,5000,10000,50000]:[100,500,1000,5000]).map(v => <button className={"chip "+(volume===v?"active":"")} onClick={()=>setVolume(v)} key={v}>{v>=1000 ? (v/1000)+"K" : v}/day</button>)}</div>
          <div style={{fontSize:12,fontWeight:800,margin:"20px 0 10px"}}>Evaluation axes</div>
          {axes.map(a => <div key={a[0]} style={{display:"flex",gap:10,alignItems:"center",fontSize:12,padding:"7px 0"}}><span className="check active">✓</span>{a[1]}</div>)}
        </aside>
        <main className="bench-main">
          <div style={{height:44,background:"white",borderBottom:"1px solid #e5e7eb",display:"flex",alignItems:"center",padding:"0 20px",fontSize:11,color:"#6b7280"}}>Benchmark Results {results && <span className="pill" style={{marginLeft:8,background:"#DCFCE7",color:"#166534"}}>Complete</span>}</div>
          <div className="bench-results">
            {!results && <div style={{height:"100%",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",color:"#9CA3AF",textAlign:"center"}}><div style={{fontSize:36}}>＋</div><strong>No benchmark yet</strong><div style={{fontSize:12}}>Select models and click Benchmark AI Models</div></div>}
            {results && <>
              <h2 style={{marginTop:0}}>Model Comparison Results</h2>
              <p style={{fontSize:12,color:"#6B7280"}}>{results.length} models · {isImage?"Image":"Video"} · {volume} units/day</p>
              {results.map((r,i) => <div className="result-card" key={r.id}>
                <div className="result-head">
                  <div><strong>{i+1}. {r.name}</strong><div style={{fontSize:10,color:"#6B7280"}}>{r.vendor} · current</div></div>
                  <div style={{fontSize:22,fontWeight:900,color:r.overall>=80?C.green:C.amber}}>{r.overall}</div>
                </div>
                <div style={{padding:16,display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px 18px"}}>
                  {axes.map(a => <div key={a[0]}>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#6B7280",marginBottom:3}}><span>{a[1]}</span><strong>{r.scores[a[0]]}</strong></div>
                    <div className="bar"><div style={{width:r.scores[a[0]]+"%",background:r.scores[a[0]]>=80?"#10B981":"#F59E0B"}} /></div>
                  </div>)}
                </div>
                <div style={{margin:"0 16px 16px",background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:8,padding:"8px 12px",fontSize:11,color:"#166534"}}>💡 Best suited for fashion production with human QA and governance review.</div>
              </div>)}
            </>}
          </div>
        </main>
      </section>;
    }

    function Tools() {
      const [filter,setFilter] = useState("All");
      const filters = ["All","Adobe","Google","OpenAI / ChatGPT","Figma Weave","Topaz Labs"];
      const list = TOOL_LIB.filter(t => filter==="All" || t[1] === filter);
      return <main>
        <Divider label="Filter" />
        <div className="chips" style={{marginBottom:24}}>{filters.map(f=><button className={"chip "+(filter===f?"active":"")} key={f} onClick={()=>setFilter(f)}>{f}</button>)}</div>
        <div className="tool-grid">{list.map(t => <div className="tool-card" key={t[0]}>
          <div className="tool-head">
            <div style={{display:"flex",justifyContent:"space-between",gap:10}}>
              <strong>{t[0]}</strong><span className="tag" style={{background:"#ECFDF5",color:"#065F46",border:"1px solid #A7F3D0"}}>{t[2]}</span>
            </div>
            <div style={{fontSize:11,color:"#0052CC",fontWeight:800,marginTop:7}}>{t[1]}</div>
          </div>
          <div style={{padding:16,fontSize:12,color:"#6B7280",lineHeight:1.7}}>
            <strong style={{color:"#111827"}}>Capabilities:</strong><br />{t[3]}<br /><br />
            <strong style={{color:"#111827"}}>Use cases:</strong><br />{t[4]}
          </div>
        </div>)}</div>
      </main>;
    }

    function App() {
      const [page,setPage] = useState("analyzer");
      const pages = [
        ["analyzer","Use Case → Workflow"],
        ["image","AI Image Models Benchmark"],
        ["video","AI Video Models Benchmark"],
        ["tools","AI Tools Library"],
      ];
      return <div className="app">
        <Header />
        <div className="tabs">{pages.map(p => <button key={p[0]} className={"tab "+(page===p[0]?"active":"")} onClick={()=>setPage(p[0])}>{p[1]}</button>)}</div>
        {page === "analyzer" && <Analyzer />}
        {page === "image" && <Benchmark kind="image" />}
        {page === "video" && <Benchmark kind="video" />}
        {page === "tools" && <Tools />}
      </div>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
